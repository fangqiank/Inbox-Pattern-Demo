<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7"/><stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#35495e"/><stop offset="100%" style="stop-color:#42b883"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/><stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c"/><stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/><stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/><stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowSky" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0ea5e9"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a855f7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f97316"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#42b883"/>
    </marker>
  </defs>

  <style>
    .flow-line-sky { stroke-dasharray: 8,4; animation: dash-flow-sky 0.5s linear infinite; }
    .flow-line-purple { stroke-dasharray: 8,4; animation: dash-flow-purple 0.5s linear infinite; }
    .flow-line-orange { stroke-dasharray: 8,4; animation: dash-flow-orange 0.5s linear infinite; }
    .flow-line-blue { stroke-dasharray: 8,4; animation: dash-flow-blue 0.5s linear infinite; }
    .flow-line-green { stroke-dasharray: 8,4; animation: dash-flow-green 0.5s linear infinite; }
    .flow-line-teal { stroke-dasharray: 8,4; animation: dash-flow-teal 0.5s linear infinite; }
    @keyframes dash-flow-sky { to { stroke-dashoffset: -12; } }
    @keyframes dash-flow-purple { to { stroke-dashoffset: -12; } }
    @keyframes dash-flow-orange { to { stroke-dashoffset: -12; } }
    @keyframes dash-flow-blue { to { stroke-dashoffset: -12; } }
    @keyframes dash-flow-green { to { stroke-dashoffset: -12; } }
    @keyframes dash-flow-teal { to { stroke-dashoffset: -12; } }
    .card-text { font-size: 12px; fill: #374151; }
    .card-sub { font-size: 10.5px; fill: #6b7280; }
    .label { font-size: 10px; fill: #6b7280; font-style: italic; }
  </style>

  <!-- Background -->
  <rect width="1200" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Transactional Inbox Pattern Demo</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">事务性收件箱模式演示 — .NET 10 + MassTransit + PostgreSQL + RabbitMQ</text>

  <!-- ==================== FLOW LINES ==================== -->

  <!-- User → Frontend -->
  <path d="M 80 280 L 170 280" stroke="#e0f2fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 80 280 L 170 280" class="flow-line-sky" stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#arrowSky)" stroke-linecap="round"/>
  <text x="125" y="270" class="label" text-anchor="middle">HTTP</text>

  <!-- Frontend → API -->
  <path d="M 390 240 L 480 240" stroke="#f5f3ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 390 240 L 480 240" class="flow-line-teal" stroke="#42b883" stroke-width="3" fill="none" marker-end="url(#arrowTeal)" stroke-linecap="round"/>
  <text x="435" y="230" class="label" text-anchor="middle">POST /api/orders</text>

  <!-- Frontend ← API (GET) -->
  <path d="M 480 310 L 390 310" stroke="#f5f3ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 480 310 L 390 310" class="flow-line-teal" stroke="#42b883" stroke-width="3" fill="none" marker-end="url(#arrowTeal)" stroke-linecap="round"/>
  <text x="435" y="335" class="label" text-anchor="middle">GET /api/inbox-messages</text>

  <!-- API → RabbitMQ -->
  <path d="M 710 240 L 800 240" stroke="#faf5ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 710 240 L 800 240" class="flow-line-purple" stroke="#a855f7" stroke-width="3" fill="none" marker-end="url(#arrowPurple)" stroke-linecap="round"/>
  <text x="755" y="230" class="label" text-anchor="middle">Publish</text>

  <!-- RabbitMQ → InboxConsumer -->
  <path d="M 940 300 L 940 385" stroke="#fff7ed" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 940 300 L 940 385" class="flow-line-orange" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  <text x="965" y="350" class="label">Consume</text>

  <!-- InboxConsumer → PostgreSQL -->
  <path d="M 800 470 L 620 470" stroke="#eff6ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 800 470 L 620 470" class="flow-line-blue" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <text x="710" y="460" class="label" text-anchor="middle">INSERT (ON CONFLICT DO NOTHING)</text>

  <!-- PostgreSQL → BackgroundProcessor -->
  <path d="M 480 470 L 330 470" stroke="#f0fdf4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 480 470 L 330 470" class="flow-line-green" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <text x="405" y="460" class="label" text-anchor="middle">POLL (FOR UPDATE SKIP LOCKED)</text>

  <!-- BackgroundProcessor → PostgreSQL (mark processed) -->
  <path d="M 330 500 L 480 500" stroke="#f0fdf4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 330 500 L 480 500" class="flow-line-green" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <text x="405" y="520" class="label" text-anchor="middle">UPDATE processed_on_utc</text>

  <!-- ==================== MODULE CARDS ==================== -->

  <!-- User -->
  <g transform="translate(10, 220)">
    <rect width="70" height="120" rx="12" fill="#f1f5f9" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="70" height="32" rx="12" fill="url(#skyGradient)"/>
    <text x="35" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">User</text>
    <text x="35" y="60" text-anchor="middle" class="card-text">Browser</text>
    <text x="35" y="80" text-anchor="middle" class="card-sub">http://localhost</text>
    <text x="35" y="95" text-anchor="middle" class="card-sub">:5181</text>
  </g>

  <!-- Frontend (Blazor) -->
  <g transform="translate(170, 185)">
    <rect width="220" height="180" rx="12" fill="#f0fdf4" stroke="#42b883" stroke-width="2"/>
    <rect width="220" height="35" rx="12" fill="url(#tealGradient)"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">InboxDemo.Frontend</text>
    <text x="110" y="60" text-anchor="middle" class="card-text" font-weight="600">Blazor Server</text>
    <text x="110" y="80" text-anchor="middle" class="card-sub">Create Order Form</text>
    <text x="110" y="96" text-anchor="middle" class="card-sub">Inbox Messages Monitor</text>
    <text x="110" y="112" text-anchor="middle" class="card-sub">RabbitMQ Queue Viewer</text>
    <text x="110" y="132" text-anchor="middle" class="card-sub">Auto-refresh (3s)</text>
    <text x="110" y="152" text-anchor="middle" class="card-sub">IBM Plex Mono / Dark Theme</text>
  </g>

  <!-- API -->
  <g transform="translate(480, 170)">
    <rect width="230" height="210" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect width="230" height="35" rx="12" fill="url(#purpleGradient)"/>
    <text x="115" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">InboxDemo.Api</text>
    <text x="115" y="58" text-anchor="middle" class="card-text" font-weight="600">Minimal API + MassTransit</text>
    <text x="115" y="80" text-anchor="middle" class="card-text">POST /api/orders</text>
    <text x="115" y="98" text-anchor="middle" class="card-sub">→ Publish OrderCreated</text>
    <text x="115" y="118" text-anchor="middle" class="card-text">GET /api/inbox-messages</text>
    <text x="115" y="136" text-anchor="middle" class="card-sub">→ Query inbox_messages</text>
    <text x="115" y="160" text-anchor="middle" class="card-sub">In-Memory Outbox</text>
    <text x="115" y="178" text-anchor="middle" class="card-sub">CORS + Dapper + Npgsql</text>
  </g>

  <!-- RabbitMQ -->
  <g transform="translate(800, 165)">
    <rect width="200" height="135" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect width="200" height="35" rx="12" fill="url(#orangeGradient)"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">RabbitMQ 3</text>
    <text x="100" y="58" text-anchor="middle" class="card-text" font-weight="600">Message Broker</text>
    <text x="100" y="78" text-anchor="middle" class="card-sub">AMQP: 5673</text>
    <text x="100" y="95" text-anchor="middle" class="card-sub">Management: 15673</text>
    <text x="100" y="115" text-anchor="middle" class="card-sub">order-created-inbox</text>
  </g>

  <!-- InboxConsumer (Processor) -->
  <g transform="translate(800, 385)">
    <rect width="260" height="140" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect width="260" height="35" rx="12" fill="url(#orangeGradient)"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">InboxDemo.Processor</text>
    <text x="130" y="58" text-anchor="middle" class="card-text" font-weight="600">InboxConsumer</text>
    <text x="130" y="78" text-anchor="middle" class="card-sub">Deserialize → InboxMessage</text>
    <text x="130" y="95" text-anchor="middle" class="card-sub">Idempotent INSERT</text>
    <text x="130" y="115" text-anchor="middle" class="card-sub">Duplicate detection via MessageId</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(490, 415)">
    <rect width="200" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="200" height="35" rx="12" fill="url(#blueGradient)"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">PostgreSQL 16</text>
    <text x="100" y="55" text-anchor="middle" class="card-text" font-weight="600">inbox_messages</text>
    <text x="100" y="75" text-anchor="middle" class="card-sub">Port: 5433</text>
    <text x="100" y="92" text-anchor="middle" class="card-sub">JSONB payload</text>
    <text x="100" y="108" text-anchor="middle" class="card-sub">Dapper ORM</text>
  </g>

  <!-- BackgroundProcessor -->
  <g transform="translate(60, 420)">
    <rect width="270" height="155" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect width="270" height="35" rx="12" fill="url(#greenGradient)"/>
    <text x="135" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">InboxBackgroundProcessor</text>
    <text x="135" y="58" text-anchor="middle" class="card-text" font-weight="600">Poll every 2s → Batch 10</text>
    <text x="135" y="78" text-anchor="middle" class="card-sub">MessageHandlerFactory routing</text>
    <text x="135" y="95" text-anchor="middle" class="card-sub">IMessageHandler → OrderCreatedHandler</text>
    <text x="135" y="115" text-anchor="middle" class="card-sub">Retry: max 3 attempts</text>
    <text x="135" y="135" text-anchor="middle" class="card-sub">Mark processed / Mark failed</text>
  </g>

  <!-- Common (shared) -->
  <g transform="translate(170, 620)">
    <rect width="180" height="90" rx="12" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/>
    <rect width="180" height="30" rx="12" fill="#6b7280"/>
    <text x="90" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">InboxDemo.Common</text>
    <text x="90" y="52" text-anchor="middle" class="card-text">OrderCreated</text>
    <text x="90" y="70" text-anchor="middle" class="card-text">InboxMessage</text>
  </g>

  <!-- Docker Compose -->
  <g transform="translate(490, 570)">
    <rect width="200" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,2"/>
    <rect width="200" height="28" rx="12" fill="#ca8a04"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">docker-compose.yml</text>
    <text x="100" y="50" text-anchor="middle" class="card-sub">PostgreSQL 16-alpine</text>
    <text x="100" y="67" text-anchor="middle" class="card-sub">RabbitMQ 3-management-alpine</text>
  </g>

  <!-- ==================== PROCESS DESCRIPTION ==================== -->
  <g transform="translate(730, 570)">
    <rect width="440" height="140" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="15" y="22" font-size="12" font-weight="bold" fill="#374151">Inbox Pattern Flow / 收件箱模式流程</text>
    <text x="15" y="44" font-size="11" fill="#6b7280">1. API publishes OrderCreated event → RabbitMQ (with outbox)</text>
    <text x="15" y="62" font-size="11" fill="#6b7280">2. InboxConsumer receives &amp; persists to inbox_messages (idempotent)</text>
    <text x="15" y="80" font-size="11" fill="#6b7280">3. BackgroundProcessor polls unprocessed messages every 2s</text>
    <text x="15" y="98" font-size="11" fill="#6b7280">4. Dispatches to IMessageHandler via MessageHandlerFactory</text>
    <text x="15" y="116" font-size="11" fill="#6b7280">5. Marks as processed or records failure (retry ≤ 3)</text>
    <text x="15" y="134" font-size="11" fill="#9ca3af">Concurrency safe: FOR UPDATE SKIP LOCKED (multi-instance)</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(730, 730)">
    <text x="0" y="14" font-size="11" font-weight="bold" fill="#374151">Legend</text>
    <rect x="0" y="22" width="14" height="14" rx="3" fill="#0ea5e9"/><text x="20" y="34" font-size="10" fill="#6b7280">User / Client</text>
    <rect x="100" y="22" width="14" height="14" rx="3" fill="#42b883"/><text x="120" y="34" font-size="10" fill="#6b7280">Frontend</text>
    <rect x="185" y="22" width="14" height="14" rx="3" fill="#a855f7"/><text x="205" y="34" font-size="10" fill="#6b7280">API</text>
    <rect x="240" y="22" width="14" height="14" rx="3" fill="#f97316"/><text x="260" y="34" font-size="10" fill="#6b7280">RabbitMQ / Processor</text>
    <rect x="385" y="22" width="14" height="14" rx="3" fill="#3b82f6"/><text x="405" y="34" font-size="10" fill="#6b7280">PostgreSQL</text>
  </g>

</svg>
