<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b4a"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="mqGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e3a0a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="feGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a1a6a"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="commonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d29922"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="-0.5">Transactional Inbox Pattern — Architecture</text>
  <text x="550" y="56" text-anchor="middle" fill="#8b949e" font-size="11">Exactly-once message processing with PostgreSQL + RabbitMQ + MassTransit</text>

  <!-- ==================== Frontend ==================== -->
  <g filter="url(#shadow)">
    <rect x="30" y="85" width="190" height="160" rx="10" fill="url(#feGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="125" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Frontend</text>
    <text x="125" y="128" text-anchor="middle" fill="#d8b4fe" font-size="10">Blazor Server</text>
    <line x1="50" y1="138" x2="200" y2="138" stroke="#6d28d9" stroke-width="0.5"/>
    <text x="50" y="156" fill="#e0d4f7" font-size="10">POST /api/orders</text>
    <text x="50" y="172" fill="#e0d4f7" font-size="10">GET /api/inbox-messages</text>
    <text x="50" y="188" fill="#e0d4f7" font-size="10">RabbitMQ Mgmt API</text>
    <text x="50" y="204" fill="#e0d4f7" font-size="10">Auto-refresh 3s</text>
    <text x="50" y="225" fill="#a78bfa" font-size="9" font-style="italic">:5181</text>
  </g>

  <!-- ==================== API ==================== -->
  <g filter="url(#shadow)">
    <rect x="300" y="85" width="200" height="160" rx="10" fill="url(#apiGrad)" stroke="#3fb950" stroke-width="1.5"/>
    <text x="400" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">API</text>
    <text x="400" y="128" text-anchor="middle" fill="#7ee787" font-size="10">ASP.NET Core Minimal API</text>
    <line x1="320" y1="138" x2="480" y2="138" stroke="#238636" stroke-width="0.5"/>
    <text x="320" y="156" fill="#c9f7cb" font-size="10">POST /api/orders</text>
    <text x="320" y="172" fill="#c9f7cb" font-size="10">GET /api/inbox-messages</text>
    <line x1="320" y1="182" x2="480" y2="182" stroke="#238636" stroke-width="0.5"/>
    <text x="320" y="198" fill="#7ee787" font-size="10">MassTransit Outbox</text>
    <text x="320" y="214" fill="#7ee787" font-size="10">Dapper + Npgsql</text>
    <text x="320" y="225" fill="#56d364" font-size="9" font-style="italic">:5264</text>
  </g>

  <!-- ==================== RabbitMQ ==================== -->
  <g filter="url(#shadow)">
    <rect x="580" y="85" width="200" height="160" rx="10" fill="url(#mqGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="680" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">RabbitMQ</text>
    <text x="680" y="128" text-anchor="middle" fill="#fcd34d" font-size="10">MassTransit 8.3</text>
    <line x1="600" y1="138" x2="760" y2="138" stroke="#b45309" stroke-width="0.5"/>
    <text x="600" y="156" fill="#fef3c7" font-size="10">Exchange: InboxDemo...</text>
    <text x="600" y="172" fill="#fef3c7" font-size="10">Queue: order-created-inbox</text>
    <line x1="600" y1="182" x2="760" y2="182" stroke="#b45309" stroke-width="0.5"/>
    <text x="600" y="198" fill="#fcd34d" font-size="10">AMQP :5673</text>
    <text x="600" y="214" fill="#fcd34d" font-size="10">Management :15673</text>
    <text x="600" y="225" fill="#fbbf24" font-size="9" font-style="italic">guest / guest</text>
  </g>

  <!-- ==================== PostgreSQL ==================== -->
  <g filter="url(#shadow)">
    <rect x="850" y="85" width="200" height="160" rx="10" fill="url(#dbGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="950" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">PostgreSQL</text>
    <text x="950" y="128" text-anchor="middle" fill="#93c5fd" font-size="10">16 Alpine</text>
    <line x1="870" y1="138" x2="1030" y2="138" stroke="#2563eb" stroke-width="0.5"/>
    <text x="870" y="156" fill="#dbeafe" font-size="10">inbox_messages</text>
    <text x="870" y="172" fill="#dbeafe" font-size="10">  id UUID PK</text>
    <text x="870" y="188" fill="#dbeafe" font-size="10">  message_type, payload</text>
    <text x="870" y="204" fill="#dbeafe" font-size="10">  processed_on_utc, retry_count</text>
    <text x="870" y="225" fill="#60a5fa" font-size="9" font-style="italic">:5433 / inbox_demo</text>
  </g>

  <!-- ==================== Processor ==================== -->
  <g filter="url(#shadow)">
    <rect x="580" y="310" width="470" height="180" rx="10" fill="url(#procGrad)" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="815" y="338" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Processor</text>
    <text x="815" y="354" text-anchor="middle" fill="#7cc4fa" font-size="10">.NET 10 Worker Service</text>
    <line x1="600" y1="364" x2="1030" y2="364" stroke="#1a4a7a" stroke-width="0.5"/>

    <!-- InboxConsumer -->
    <rect x="600" y="375" width="140" height="55" rx="6" fill="rgba(255,255,255,0.08)" stroke="#58a6ff" stroke-width="1"/>
    <text x="670" y="395" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">InboxConsumer</text>
    <text x="670" y="412" text-anchor="middle" fill="#8b949e" font-size="9">Consume + INSERT</text>
    <text x="670" y="425" text-anchor="middle" fill="#8b949e" font-size="8">ON CONFLICT DO NOTHING</text>

    <!-- InboxDatabase -->
    <rect x="755" y="375" width="140" height="55" rx="6" fill="rgba(255,255,255,0.08)" stroke="#58a6ff" stroke-width="1"/>
    <text x="825" y="395" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">InboxDatabase</text>
    <text x="825" y="412" text-anchor="middle" fill="#8b949e" font-size="9">Dapper + Npgsql</text>
    <text x="825" y="425" text-anchor="middle" fill="#8b949e" font-size="8">Transaction + SKIP LOCKED</text>

    <!-- BackgroundProcessor -->
    <rect x="910" y="375" width="125" height="55" rx="6" fill="rgba(255,255,255,0.08)" stroke="#58a6ff" stroke-width="1"/>
    <text x="972" y="395" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">Background</text>
    <text x="972" y="409" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">Processor</text>
    <text x="972" y="425" text-anchor="middle" fill="#8b949e" font-size="8">poll 2s + dispatch</text>

    <!-- MessageHandlerFactory -->
    <rect x="600" y="445" width="210" height="35" rx="6" fill="rgba(255,255,255,0.08)" stroke="#58a6ff" stroke-width="1"/>
    <text x="705" y="467" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">MessageHandlerFactory</text>

    <!-- OrderCreatedHandler -->
    <rect x="825" y="445" width="210" height="35" rx="6" fill="rgba(255,255,255,0.08)" stroke="#58a6ff" stroke-width="1"/>
    <text x="930" y="467" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">OrderCreatedHandler</text>

    <!-- Internal arrows -->
    <line x1="740" y1="402" x2="755" y2="402" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrowBlue)"/>
    <line x1="895" y1="402" x2="910" y2="402" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrowBlue)"/>
    <line x1="972" y1="430" x2="705" y2="445" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>
    <line x1="810" y1="462" x2="825" y2="462" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ==================== Common ==================== -->
  <g filter="url(#shadow)">
    <rect x="300" y="360" width="200" height="70" rx="10" fill="url(#commonGrad)" stroke="#6b7280" stroke-width="1.5"/>
    <text x="400" y="388" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Common</text>
    <text x="400" y="405" text-anchor="middle" fill="#d1d5db" font-size="10">OrderCreated, InboxMessage</text>
    <text x="400" y="420" text-anchor="middle" fill="#9ca3af" font-size="9">Shared Models</text>
  </g>

  <!-- ==================== Flow Arrows ==================== -->

  <!-- Frontend → API -->
  <line x1="220" y1="140" x2="300" y2="140" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="260" y="134" text-anchor="middle" fill="#a78bfa" font-size="9">HTTP</text>

  <!-- API → RabbitMQ -->
  <line x1="500" y1="140" x2="580" y2="140" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="540" y="134" text-anchor="middle" fill="#56d364" font-size="9">publish</text>

  <!-- RabbitMQ → Processor (consume) -->
  <path d="M 680 245 L 680 310" stroke="#d29922" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="695" y="280" fill="#fbbf24" font-size="9">consume</text>

  <!-- API → PostgreSQL (query) -->
  <path d="M 500 170 Q 680 230 950 245" stroke="#58a6ff" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <text x="730" y="220" fill="#58a6ff" font-size="9">query inbox_messages</text>

  <!-- Processor → PostgreSQL (transaction) -->
  <path d="M 850 400 Q 920 280 950 245" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="910" y="295" fill="#58a6ff" font-size="9" text-anchor="end">INSERT / SELECT</text>
  <text x="910" y="308" fill="#58a6ff" font-size="9" text-anchor="end">FOR UPDATE</text>
  <text x="910" y="321" fill="#58a6ff" font-size="9" text-anchor="end">SKIP LOCKED</text>

  <!-- Frontend → RabbitMQ Mgmt -->
  <path d="M 125 245 Q 125 280 400 310 Q 580 330 580 310 L 630 245" stroke="#d29922" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <text x="340" y="298" fill="#fbbf24" font-size="8">Management API :15673</text>

  <!-- ==================== Legend ==================== -->
  <g transform="translate(30, 530)">
    <rect width="1040" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="20" fill="#8b949e" font-size="11" font-weight="600">Guarantees</text>

    <rect x="20" y="32" width="10" height="10" rx="2" fill="#3fb950"/>
    <text x="36" y="41" fill="#c9d1d9" font-size="10">Idempotent (ON CONFLICT DO NOTHING)</text>

    <rect x="280" y="32" width="10" height="10" rx="2" fill="#3b82f6"/>
    <text x="296" y="41" fill="#c9d1d9" font-size="10">Concurrency-safe (FOR UPDATE SKIP LOCKED)</text>

    <rect x="600" y="32" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="616" y="41" fill="#c9d1d9" font-size="10">Retry max 3 (exponential backoff 5s x retry_count)</text>

    <rect x="20" y="52" width="10" height="10" rx="2" fill="#1f6feb"/>
    <text x="36" y="61" fill="#c9d1d9" font-size="10">Transactional (poll + process + mark in one DB transaction)</text>

    <rect x="440" y="52" width="10" height="10" rx="2" fill="#8b5cf6"/>
    <text x="456" y="61" fill="#c9d1d9" font-size="10">Dead Letter after 3 failures (error + retry_count >= 3)</text>
  </g>
</svg>
