<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .flow-line-green { stroke-dasharray: 8, 4; animation: dash-flow-green 0.5s linear infinite; }
      .flow-line-orange { stroke-dasharray: 8, 4; animation: dash-flow-orange 0.5s linear infinite; }
      .flow-line-blue { stroke-dasharray: 8, 4; animation: dash-flow-blue 0.5s linear infinite; }
      .flow-line-purple { stroke-dasharray: 8, 4; animation: dash-flow-purple 0.5s linear infinite; }
      .flow-line-teal { stroke-dasharray: 8, 4; animation: dash-flow-teal 0.5s linear infinite; }
      .flow-line-sky { stroke-dasharray: 8, 4; animation: dash-flow-sky 0.5s linear infinite; }
      @keyframes dash-flow-green { to { stroke-dashoffset: -12; } }
      @keyframes dash-flow-orange { to { stroke-dashoffset: -12; } }
      @keyframes dash-flow-blue { to { stroke-dashoffset: -12; } }
      @keyframes dash-flow-purple { to { stroke-dashoffset: -12; } }
      @keyframes dash-flow-teal { to { stroke-dashoffset: -12; } }
      @keyframes dash-flow-sky { to { stroke-dashoffset: -12; } }
    </style>
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="workerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="infraGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="domainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="frontendGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35495e"/><stop offset="100%" stop-color="#42b883"/>
    </linearGradient>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a855f7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f97316"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
    <marker id="arrowSky" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Outbox &amp; Inbox Pattern Demo</text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#64748b">Transactional Outbox + Inbox Pattern / .NET 10 + EF Core + PostgreSQL</text>

  <!-- ==================== PRODUCER SIDE (API) ==================== -->

  <!-- Frontend Browser -->
  <g transform="translate(40, 80)">
    <rect width="200" height="120" rx="12" fill="#f0fdf4" stroke="#42b883" stroke-width="2"/>
    <rect width="200" height="32" rx="12" fill="url(#frontendGradient)"/>
    <rect x="0" y="20" width="200" height="12" fill="url(#frontendGradient)"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Frontend (Browser)</text>
    <circle cx="18" cy="12" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="30" cy="12" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="42" cy="12" r="4" fill="#22c55e" opacity="0.8"/>
    <text x="100" y="55" text-anchor="middle" font-size="10" fill="#334155">Vanilla HTML/CSS/JS</text>
    <text x="100" y="72" text-anchor="middle" font-size="9" fill="#64748b">Dark Theme | Auto-refresh 5s</text>
    <rect x="12" y="82" width="80" height="20" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="52" y="96" text-anchor="middle" font-size="8" fill="#16a34a">Outbox</text>
    <rect x="100" y="82" width="80" height="20" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="140" y="96" text-anchor="middle" font-size="8" fill="#16a34a">Inbox</text>
  </g>

  <!-- Flow: Frontend -> API -->
  <path d="M240,145 L290,145" stroke="#dcfce7" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M240,145 L290,145" class="flow-line-teal" stroke="#42b883" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <text x="265" y="138" text-anchor="middle" font-size="9" fill="#42b883" font-weight="bold">1</text>

  <!-- API Card -->
  <g transform="translate(300, 80)">
    <rect width="220" height="170" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect width="220" height="35" rx="12" fill="url(#apiGradient)"/>
    <rect x="0" y="23" width="220" height="12" fill="url(#apiGradient)"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">API (ASP.NET Core)</text>
    <text x="110" y="55" text-anchor="middle" font-size="9" fill="#64748b">Minimal APIs | Static Files</text>
    <text x="14" y="73" font-size="9" fill="#7c3aed">POST /api/users</text>
    <text x="14" y="87" font-size="9" fill="#7c3aed">POST /api/users/{id}/follow/{id}</text>
    <text x="14" y="101" font-size="9" fill="#7c3aed">GET /api/outbox/messages</text>
    <text x="14" y="115" font-size="9" fill="#7c3aed">GET /api/inbox/messages</text>
    <text x="14" y="129" font-size="9" fill="#7c3aed">GET /api/inbox/messages/{id}</text>
    <text x="14" y="143" font-size="9" fill="#7c3aed">GET /api/inbox/stats</text>
    <text x="14" y="157" font-size="9" fill="#7c3aed">GET /api/users</text>
  </g>

  <!-- Flow: API -> Infrastructure (SaveChanges) -->
  <path d="M410,255 L410,290" stroke="#f3e8ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M410,255 L410,290" class="flow-line-purple" stroke="#a855f7" stroke-width="3" fill="none" marker-end="url(#arrowPurple)" stroke-linecap="round"/>
  <text x="425" y="278" font-size="9" fill="#7c3aed" font-weight="bold">2</text>
  <text x="440" y="278" font-size="8" fill="#7c3aed">Entity raises event</text>

  <!-- Infrastructure Card -->
  <g transform="translate(300, 300)">
    <rect width="320" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="35" rx="12" fill="url(#infraGradient)"/>
    <rect x="0" y="23" width="320" height="12" fill="url(#infraGradient)"/>
    <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Infrastructure</text>
    <text x="16" y="55" font-size="10" fill="#2563eb" font-weight="bold">OutboxSaveChangesInterceptor</text>
    <text x="16" y="70" font-size="9" fill="#475569">Captures domain events, serializes JSON</text>
    <text x="16" y="84" font-size="9" fill="#475569">Inserts OutboxMessage in SAME transaction</text>
    <rect x="16" y="94" width="130" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="81" y="109" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">AppDbContext</text>
    <rect x="156" y="94" width="140" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="226" y="109" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">EF Core Config</text>
    <rect x="16" y="122" width="70" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="51" y="135" text-anchor="middle" font-size="8" fill="#2563eb">OutboxMsg</text>
    <rect x="94" y="122" width="68" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="128" y="135" text-anchor="middle" font-size="8" fill="#2563eb">InboxMsg</text>
    <rect x="170" y="122" width="128" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="234" y="135" text-anchor="middle" font-size="8" fill="#2563eb">3x Event Handlers</text>
  </g>

  <!-- Domain Card -->
  <g transform="translate(650, 300)">
    <rect width="200" height="90" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect width="200" height="32" rx="12" fill="url(#domainGradient)"/>
    <rect x="0" y="20" width="200" height="12" fill="url(#domainGradient)"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Domain</text>
    <text x="16" y="50" font-size="9" fill="#16a34a">Entity | DomainEvent</text>
    <text x="16" y="65" font-size="9" fill="#16a34a">UserFollowedEvent</text>
    <text x="16" y="80" font-size="9" fill="#16a34a">User + UserFollow</text>
  </g>

  <!-- ==================== DATABASE ==================== -->

  <!-- Flow: Infrastructure -> Database (atomic write) -->
  <path d="M460,455 L460,490" stroke="#e0f2fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M460,455 L460,490" class="flow-line-blue" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <text x="475" y="478" font-size="9" fill="#2563eb" font-weight="bold">3</text>
  <text x="495" y="478" font-size="8" fill="#2563eb">Atomic TX</text>

  <!-- PostgreSQL Database -->
  <g transform="translate(260, 500)">
    <rect width="400" height="140" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="400" height="35" rx="12" fill="url(#dbGradient)"/>
    <rect x="0" y="23" width="400" height="12" fill="url(#dbGradient)"/>
    <ellipse cx="24" cy="18" rx="10" ry="6" fill="none" stroke="#fff" stroke-width="1.5"/>
    <line x1="14" y1="18" x2="14" y2="26" stroke="#fff" stroke-width="1.5"/>
    <line x1="34" y1="18" x2="34" y2="26" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="24" cy="26" rx="10" ry="6" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="200" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">PostgreSQL 16 (Docker)</text>

    <rect x="14" y="45" width="88" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
    <text x="58" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#0284c7">users</text>
    <text x="58" y="76" text-anchor="middle" font-size="8" fill="#475569">user_follows</text>

    <rect x="114" y="45" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="174" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">outbox_messages</text>
    <text x="174" y="76" text-anchor="middle" font-size="8" fill="#92400e">Name, Content, RetryCount</text>

    <rect x="246" y="45" width="140" height="40" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="316" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#be185d">inbox_messages</text>
    <text x="316" y="76" text-anchor="middle" font-size="8" fill="#9d174d">UNIQUE(MessageId, Handler)</text>

    <rect x="14" y="96" width="110" height="28" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <text x="69" y="114" text-anchor="middle" font-size="8" font-weight="bold" fill="#a16207">Atomic Transaction</text>

    <rect x="136" y="96" width="140" height="28" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <text x="206" y="114" text-anchor="middle" font-size="8" font-weight="bold" fill="#a16207">FOR UPDATE SKIP LOCKED</text>

    <rect x="288" y="96" width="100" height="28" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <text x="338" y="114" text-anchor="middle" font-size="8" font-weight="bold" fill="#a16207">Per-Handler Idem.</text>
  </g>

  <!-- ==================== CONSUMER SIDE (Worker) ==================== -->

  <!-- Flow: Database -> Worker (poll) -->
  <path d="M660,580 L720,580 L720,400 L770,400" stroke="#fff7ed" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M660,580 L720,580 L720,400 L770,400" class="flow-line-orange" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  <text x="735" y="490" font-size="9" fill="#ea580c" font-weight="bold">4</text>
  <text x="735" y="502" font-size="8" fill="#ea580c">Poll 5s</text>

  <!-- Worker Card -->
  <g transform="translate(780, 310)">
    <rect width="380" height="200" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect width="380" height="35" rx="12" fill="url(#workerGradient)"/>
    <rect x="0" y="23" width="380" height="12" fill="url(#workerGradient)"/>
    <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Worker (BackgroundService)</text>
    <text x="190" y="55" text-anchor="middle" font-size="10" fill="#ea580c" font-weight="bold">InboxProcessor</text>
    <text x="16" y="72" font-size="9" fill="#475569">FOR UPDATE SKIP LOCKED | Max 3 retries</text>
    <text x="16" y="86" font-size="9" fill="#475569">Deserialize by Name, dispatch via Task.WhenAll</text>

    <rect x="16" y="98" width="108" height="44" rx="6" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
    <text x="70" y="115" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">SendNotification</text>
    <text x="70" y="128" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">Handler</text>
    <text x="70" y="138" text-anchor="middle" font-size="7" fill="#9a3412">100ms</text>

    <rect x="136" y="98" width="108" height="44" rx="6" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
    <text x="190" y="115" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">UpdateFollowStats</text>
    <text x="190" y="128" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">Handler</text>
    <text x="190" y="138" text-anchor="middle" font-size="7" fill="#9a3412">50ms</text>

    <rect x="256" y="98" width="108" height="44" rx="6" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
    <text x="310" y="115" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">AddToTimeline</text>
    <text x="310" y="128" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">Handler</text>
    <text x="310" y="138" text-anchor="middle" font-size="7" fill="#9a3412">75ms</text>

    <text x="190" y="160" text-anchor="middle" font-size="9" fill="#ea580c" font-weight="bold">5 Run in parallel</text>
    <text x="190" y="175" text-anchor="middle" font-size="9" fill="#ea580c" font-weight="bold">6 Write InboxMessage per handler</text>
    <rect x="90" y="182" width="200" height="12" rx="3" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="190" y="192" text-anchor="middle" font-size="7" fill="#c2410c">UNIQUE(MessageId, HandlerName) = Idempotency</text>
  </g>

  <!-- ==================== BOTTOM: Flow Description ==================== -->

  <g transform="translate(40, 670)">
    <rect width="1120" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="560" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Data Flow</text>

    <text x="24" y="48" font-size="10" fill="#334155"><tspan font-weight="bold" fill="#42b883">1</tspan> Browser sends HTTP request to API</text>
    <text x="24" y="66" font-size="10" fill="#334155"><tspan font-weight="bold" fill="#7c3aed">2</tspan> Entity raises DomainEvent in-memory</text>
    <text x="24" y="84" font-size="10" fill="#334155"><tspan font-weight="bold" fill="#2563eb">3</tspan> Interceptor serializes event and inserts OutboxMessage (atomic TX)</text>
    <text x="580" y="48" font-size="10" fill="#334155"><tspan font-weight="bold" fill="#ea580c">4</tspan> Worker polls outbox_messages every 5s (FOR UPDATE SKIP LOCKED)</text>
    <text x="580" y="66" font-size="10" fill="#334155"><tspan font-weight="bold" fill="#ea580c">5</tspan> Deserialize by Name, dispatch to 3 handlers via Task.WhenAll</text>
    <text x="580" y="84" font-size="10" fill="#334155"><tspan font-weight="bold" fill="#ea580c">6</tspan> Each handler writes InboxMessage (UNIQUE MessageId+HandlerName)</text>

    <rect x="24" y="100" width="80" height="20" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="64" y="114" text-anchor="middle" font-size="9" fill="#1d4ed8">.NET 10</text>
    <rect x="114" y="100" width="90" height="20" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="159" y="114" text-anchor="middle" font-size="9" fill="#1d4ed8">EF Core 10</text>
    <rect x="214" y="100" width="100" height="20" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
    <text x="264" y="114" text-anchor="middle" font-size="9" fill="#0284c7">PostgreSQL 16</text>
    <rect x="324" y="100" width="70" height="20" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="359" y="114" text-anchor="middle" font-size="9" fill="#334155">Docker</text>
    <rect x="404" y="100" width="110" height="20" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
    <text x="459" y="114" text-anchor="middle" font-size="9" fill="#7c3aed">System.Text.Json</text>
    <rect x="524" y="100" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
    <text x="574" y="114" text-anchor="middle" font-size="9" fill="#16a34a">Scalar OpenAPI</text>
  </g>
</svg>
